# Builds catalog/dist/catalog.json from the registry and the plugins' GitHub releases (docs/CATALOG.md).
# PRs touching the catalog only validate the registry entries; the nightly and manual runs do the full build.
name: Catalog build
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['catalog/**', 'tools/catalog_*.py', 'tools/app_*.py', 'tools/catalog_site/**', 'tools/skin_compat.py', 'tools/skin_roles_2x.json', 'tools/test_skin_compat.py']
  pull_request:
    paths: ['catalog/**', 'tools/catalog_*.py', 'tools/app_*.py', 'tools/catalog_site/**', 'tools/skin_compat.py', 'tools/skin_roles_2x.json', 'tools/test_skin_compat.py']
permissions:
  contents: read
  issues: write
# One run at a time per branch: two overlapping runs each opened the same issue (#112, #113).
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 tools/test_catalog.py
      - name: Skin compatibility tests
        run: python3 tools/test_skin_compat.py
      - name: Validate the registry
        run: python3 tools/catalog_build.py --check-registry
      - name: New or changed listings must release the portable layout
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          ids=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}" -- catalog/plugins | xargs -r -n1 basename | sed 's/\.json$//')
          [ -z "$ids" ] || python3 tools/catalog_build.py --require-portable $ids
      - name: Validate the companion apps
        run: python3 tools/app_check.py
      - name: Build the catalog
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/catalog_build.py
      - name: Resolve companion app downloads from their releases
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/app_resolve.py
      - name: Open and close issues for failing releases
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/catalog_issues.py
      - name: Generate the site
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 tools/catalog_site.py
      - name: Upload the Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: catalog/dist/site
      - name: Upload catalog.json and problems.json
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: catalog/dist/
  deploy:
    # Needs Settings > Pages > Source: GitHub Actions (one-time, by the repo owner).
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
  mirror:
    # Keeps the OLD catalog address answering after the repo has moved to another owner (docs/ORG_MIGRATION.md, step 2), by committing a
    # copy of the data files and redirect pages to a repo that hosts it (a user-site repo such as sd88me/sd88me.github.io). Does nothing
    # until the repository variable CATALOG_MIRROR_REPO is set. One-time setup by the repo owner:
    #   - a deploy key WITH write access on that repo, its private half in the secret MIRROR_DEPLOY_KEY (no account-wide token)
    #   - variables: CATALOG_MIRROR_REPO (owner/name), optional CATALOG_MIRROR_DIR (folder in it, default: this repo's name)
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CATALOG_MIRROR_REPO != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: catalog-mirror
      cancel-in-progress: false
    env:
      MIRROR_DIR: ${{ vars.CATALOG_MIRROR_DIR || github.event.repository.name }}
      NEW_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools-src
      - uses: actions/download-artifact@v4
        with:
          name: catalog
          path: dist
      - name: Check out the repo that hosts the old address
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CATALOG_MIRROR_REPO }}
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          path: mirror
      - name: Build the copy
        run: python3 tools-src/tools/catalog_mirror.py --site dist/site --out "mirror/$MIRROR_DIR" --new-base "$NEW_BASE"
      - name: Commit and push if it changed
        working-directory: mirror
        run: |
          git add -A -- "$MIRROR_DIR"
          git diff --cached --quiet && { echo "mirror is up to date"; exit 0; }
          git -c user.name='catalog mirror' -c user.email='noreply@github.com' commit -q -m "Mirror the catalog from $GITHUB_REPOSITORY@${GITHUB_SHA::7}"
          git push
