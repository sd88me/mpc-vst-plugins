# Reusable: build an addin (Gen1/armv7, and optionally Gen2/aarch64 too), package each with tools/release_addin.py
# and attach the zip(s) to a DRAFT release in the calling repo. A person then installs the exact zip for their
# device (docs/ADDINS.md "Releasing", step 3) and publishes the draft, which creates the tag. The plugin counterpart
# is vst-release.yml.
#
# Call it from the addin's repo, pinning this repo to one commit in BOTH places:
#   uses: sd88me/mpc-vst-plugins/.github/workflows/addin-release.yml@<sha>
#   with: { tools_ref: <sha>, ... }
# It has no permissions: block of its own: it creates the draft release with the caller's GITHUB_TOKEN, so the calling
# job must grant   permissions: { contents: write }
#
# For an addin with a Gen2 (aarch64) build too, also set package_dir_aarch64/build_aarch64: both zips are built and
# uploaded to the same release in this one job (not two separate calls, which could race each other creating it).
name: Addin draft release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. remote-addin-v1.2.0
        type: string
        required: true
      version:
        description: Version for the zip, addin.manifest and INSTALL.md, e.g. 1.2.0
        type: string
        required: true
      tools_ref:
        description: This repo's commit - the same one as in the caller's uses:@ref
        type: string
        required: true
      package_dir:
        description: The folder the build fills with addin.manifest, the .so and the files the manifest names, relative to the caller's repo root
        type: string
        required: true
      build:
        description: Command, run from the caller's repo root, that fills <package_dir>; MPC_VST is set
        type: string
        required: true
      package_dir_aarch64:
        description: Optional Gen2 (aarch64) counterpart of package_dir; omit for an armv7-only addin
        type: string
        default: ''
      build_aarch64:
        description: Command that fills package_dir_aarch64; required together with it
        type: string
        default: ''
      host_test:
        description: Optional host test command, run from the caller's repo root; MPC_VST is set
        type: string
        default: ''
      about:
        description: One line about the addin, for INSTALL.md and the release notes
        type: string
        default: ''
      license:
        description: SPDX license id of the addin (e.g. MIT); required to be listed in the catalog
        type: string
        default: ''
      requires:
        description: One line of extra requirements for the manifest (e.g. a cable or a firmware)
        type: string
        default: ''
      depends:
        description: Other catalog plugins this release needs, space separated (e.g. percolator>=2.0.0 or tr-mpc=same; docs/CATALOG_SPEC.md "Dependencies")
        type: string
        default: ''
      conflicts:
        description: Catalog ids this release must not be installed with, space separated
        type: string
        default: ''
      dry_run:
        description: Build and package only (zip as a run artifact), no draft release
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      PACKAGE_DIR: ${{ inputs.package_dir }}
      PACKAGE_DIR_AARCH64: ${{ inputs.package_dir_aarch64 }}
      MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refuse to touch a published release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                    --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          echo "existing release for $TAG: ${state:-none}"
          if [ "$state" = published ]; then
            echo "::error::$TAG is already published - bump the version"; exit 1
          fi

      - name: Check out the addin
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: addin

      - name: Check out mpc-vst-plugins (tools)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: sd88me/mpc-vst-plugins
          ref: ${{ inputs.tools_ref }}
          path: mpc-vst-plugins

      - name: Set up QEMU (addins build under emulation -- arm for Gen1/armhf, arm64 for Gen2/aarch64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ inputs.package_dir_aarch64 != '' && 'arm,arm64' || 'arm' }}

      - name: Build (Gen1)
        working-directory: addin
        env:
          BUILD: ${{ inputs.build }}
        run: bash -euo pipefail -c "$BUILD"

      - name: Build (Gen2)
        if: ${{ inputs.package_dir_aarch64 != '' }}
        working-directory: addin
        env:
          BUILD: ${{ inputs.build_aarch64 }}
        run: bash -euo pipefail -c "$BUILD"

      - name: Host test
        if: ${{ inputs.host_test != '' }}
        working-directory: addin
        env:
          HOST_TEST: ${{ inputs.host_test }}
        run: bash -euo pipefail -c "$HOST_TEST"

      - name: Package with release_addin.py
        id: pkg
        working-directory: addin
        env:
          ABOUT: ${{ inputs.about }}
          LICENSE_ID: ${{ inputs.license }}
          REQUIRES: ${{ inputs.requires }}
          DEPENDS: ${{ inputs.depends }}
          CONFLICTS: ${{ inputs.conflicts }}
        run: |
          package_one() {   # package_one <dir> <elf-pattern>
            dir="$1"; pattern="$2"
            m="$dir/addin.manifest"
            [ -f "$m" ] || { echo "::error::no $m: the build must write addin.manifest into $dir"; exit 1; }
            key() { sed -n "s/^$1=//p" "$m" | head -1 | sed 's/^"\(.*\)"$/\1/'; }
            so="$dir/$(key ADDIN_SO)"
            file -b "$so" | grep -qE "$pattern" || { echo "::error::$so is not $pattern: $(file -b "$so")"; exit 1; }
            args=(--dir "$dir" --version "$VERSION" --about "$ABOUT" --repo "$GITHUB_REPOSITORY" -o "$GITHUB_WORKSPACE/dist")
            [ -z "$LICENSE_ID" ] || args+=(--license "$LICENSE_ID")
            [ -z "$REQUIRES" ] || args+=(--requires "$REQUIRES")
            for d in $DEPENDS; do args+=(--depends "$d"); done
            for c in $CONFLICTS; do args+=(--conflicts "$c"); done
            out=$(python3 "$MPC_VST/tools/release_addin.py" "${args[@]}")
            echo "$out"
            zip=${out%% (*}   # release_addin.py prints "<path> (<n> files, <size> MB)"; take the path
            # catalog conformance (docs/CATALOG_SPEC.md): warnings are shown, errors fail the run
            if [ -n "$LICENSE_ID" ]; then flags=(--catalog --expect-id "$(key ADDIN_ID)" --expect-repo "$GITHUB_REPOSITORY")
            else flags=(); echo "::warning::no license input: this release can't be listed in the catalog"; fi
            python3 "$MPC_VST/tools/catalog_check.py" "$zip" "${flags[@]}"
            echo "name=$(key ADDIN_NAME)" >> "$GITHUB_OUTPUT"
          }
          package_one "$PACKAGE_DIR" 'ELF 32-bit LSB.*ARM,'
          [ -z "$PACKAGE_DIR_AARCH64" ] || package_one "$PACKAGE_DIR_AARCH64" 'ELF 64-bit LSB.*ARM aarch64'

      - name: Upload the zip(s) as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: dist/*.zip
          retention-days: 14

      - name: Create or update the draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.pkg.outputs.name }}
          ABOUT: ${{ inputs.about }}
          TOOLS_REF: ${{ inputs.tools_ref }}
        run: |
          python3 - dist/*.zip > notes.md <<'PY'
          import os, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])   # the Gen1 and Gen2 zips share the same INSTALL.md content (requirements, install)
          md = z.read(next(n for n in z.namelist() if n.endswith("/INSTALL.md"))).decode()
          keep = [s for s in re.split(r"(?m)^(?=## )", md) if s.startswith(("## Requirements", "## Install"))]
          if os.environ["ABOUT"]:
              print(os.environ["ABOUT"] + "\n")
          print("".join(keep).rstrip() + "\n")
          print("Uninstalling and the file list are in `INSTALL.md` inside each zip.")
          PY
          printf '\n---\nBuilt by GitHub Actions from %s@%s with mpc-vst-plugins@%s.\n' \
            "$GITHUB_REPOSITORY" "${GITHUB_SHA::7}" "${TOOLS_REF::7}" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "$NAME v$VERSION" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.zip --draft --target "$GITHUB_SHA" --title "$NAME v$VERSION" --notes-file notes.md
          fi

      - name: Summary
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "## $TAG"
            if [ "$DRY" = true ]; then
              echo "Dry run: no release. The zip(s) are in this run's artifacts."
            else
              echo "Draft release updated: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases (drafts are only visible to maintainers)."
            fi
            for z in dist/*.zip; do echo "- Zip: \`$(basename "$z")\` ($(du -h "$z" | cut -f1))"; done
            echo
            echo "Before publishing (docs/ADDINS.md, \"Releasing\"):"
            echo "1. Install **each** zip on a matching device with its install.sh, use the addin, run its uninstall.sh."
            echo "2. Publish the draft. That creates the tag."
          } >> "$GITHUB_STEP_SUMMARY"
