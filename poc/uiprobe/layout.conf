# UI probe for the Plugin Manager redesign (docs/NOTES.md). Three questions, all driven by the engine with no taps:
# 1. value text longer than 23 characters (PARAM_TEXT_MAX 128); 2. when= panels switching on engine-changed values
# (HAS_DISPLAY_REV now also reports them with audioMasterAutomate); 3. a dense page (~170 components, 61 params).
[tab MAIN]
frame x=20 y=90 w=1240 h=150 title="1  LONG TEXT: HOW FAR DOES THE RULER GO?"
readout w=1200 h=36 cx=640 cy=150 label="RULER (80 CHARS)" key=long_ruler
readout w=1200 h=36 cx=640 cy=212 label="SENTENCE (TICKS)" key=long_sentence
frame x=20 y=250 w=760 h=200 title="2  ENGINE-DRIVEN PANELS (CYCLE EVERY 2 S)"
readout w=360 h=36 cx=220 cy=310 label="PHASE AS TEXT" key=phase_text
enum_h cx=590 cy=310 w=340 h=36 key=phase
frame x=40 y=340 w=720 h=96 title="PANEL: IDLE" when=phase:idle
button cx=400 cy=400 label="IDLE" key=tap color=393939 when=phase:idle
frame x=40 y=340 w=720 h=96 title="PANEL: PREPARING" when=phase:preparing
button cx=400 cy=400 label="PREPARING" key=tap color=2f4a6b when=phase:preparing
frame x=40 y=340 w=720 h=96 title="PANEL: READY" when=phase:ready
button cx=400 cy=400 label="READY" key=tap color=b88426 when=phase:ready
frame x=40 y=340 w=720 h=96 title="PANEL: ERROR" when=phase:error
button cx=400 cy=400 label="ERROR" key=tap color=b8382b when=phase:error
frame x=800 y=250 w=460 h=200 title="METER + PAUSE"
meter cx=900 cy=350 w=60 h=60 key=progress strip=strip.png frames=32
readout w=200 h=36 cx=1100 cy=310 label="PROGRESS" key=progress
enum_h cx=1100 cy=400 w=220 h=40 key=run
frame x=20 y=470 w=1240 h=72 title=""
