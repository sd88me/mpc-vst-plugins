# Boris Granular: one page after Boris Granular Station's own GUI (glesdora/boris-granular-station): black plate, filled
# deep-purple panels, aliceblue ink, lavender accent; TEMPO / SIZE / PITCH SHIFT / ENVELOPE across the top, the grain
# window (position + drift + freeze) bottom left, input / feedback / dry-wet bottom right. Colours from its BorisPalette.h.
style=td3
theme_bg=000000
theme_box=241a3e
theme_panel=2c2350
theme_line=483d8b
theme_ink=f0f8ff
theme_ink_dim=a7b4c8
theme_ink_faint=708090
theme_accent=b480ff
theme_accent_hi=f0f8ff
theme_knob_face=0d1717
theme_knob_ring=483d8b
theme_knob_dot=f0f8ff
theme_lcd=102020
theme_seg_active=b480ff
theme_seg_inactive=1a1430
theme_seg_active_tx=0b0716
theme_btn_bg=24114b
theme_btn_text=f0f8ff
theme_tab_on=b480ff
theme_tab_on_tx=0b0716
theme_tabs=0b0716
theme_chrome_ink=f0f8ff
theme_go_on=59cafc
theme_go_off=24114b
qlinks_track = density,grain_size,position,pitch,feedback,pan_width,freeze,mix
[tab BORIS]
frame x=16 y=96 w=300 h=324 title="TEMPO"
knob cx=96 cy=190 r=40 label="DENSITY" key=density
toggle cx=236 cy=150 label="SYNC" key=sync
popup cx=236 cy=262 w=130 h=40 label="DIVISION" key=division
enum_h cx=166 cy=380 sw=88 label="RHYTHM" key=rhythm options="NORMAL,DOTTED,TRIPLET"
frame x=324 y=96 w=280 h=324 title="SIZE"
knob cx=414 cy=190 r=40 label="SIZE" key=grain_size
knob cx=534 cy=165 r=24 label="RDM SIZE" key=random_length
knob cx=534 cy=325 r=24 label="RDM DELAY" key=random_delay
knob cx=414 cy=325 r=24 label="CHANCE" key=chance
frame x=612 y=96 w=170 h=324 title="BORIS"
knob cx=697 cy=240 r=34 label="VOICES" key=voice_count
frame x=790 y=96 w=200 h=324 title="PITCH SHIFT"
knob cx=890 cy=190 r=40 label="PITCH" key=pitch
knob cx=890 cy=325 r=24 label="RDM SHIFT" key=random_pitch
frame x=998 y=96 w=266 h=324 title="ENVELOPE"
knob cx=1131 cy=195 r=46 label="SHAPE" key=envelope
knob cx=1131 cy=325 r=24 label="REVERSE" key=reverse_prob
frame x=16 y=428 w=830 h=282 title="GRAIN WINDOW"
knob cx=190 cy=555 r=56 label="POSITION" key=position
knob cx=430 cy=555 r=56 label="DRIFT" key=drift
toggle cx=660 cy=545 label="FREEZE" key=freeze
frame x=854 y=428 w=410 h=282 title="OUTPUT"
knob cx=925 cy=495 r=28 label="INPUT" key=gain
knob cx=1059 cy=495 r=28 label="FEEDBACK" key=feedback
knob cx=1193 cy=495 r=28 label="DRY/WET" key=mix
knob cx=925 cy=625 r=22 label="PAN WIDTH" key=pan_width
toggle cx=1059 cy=618 label="MUTE" key=mute
knob cx=1193 cy=625 r=22 label="RDM VOL" key=random_vol
qlinks "GRAIN" = density,grain_size,position,pitch,feedback,pan_width,freeze,mix,envelope,drift,random_length,random_delay,random_pitch,reverse_prob,random_vol,chance
qlinks "TEMPO" = sync,division,rhythm,gain,mute,voice_count
