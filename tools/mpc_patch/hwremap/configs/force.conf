# hwremap config for Akai Force -> /sdcard/hwremap.conf on the device.
#
#@hide
# The install script writes this file with only the options you pick. Lines starting "#@" are
# markers it reads (hwremap ignores them as comments), so this whole file is also a valid config:
# every block below is then active, including the ones marked off.
#   #@always               a block that is always written
#   #@option NAME on|off   a block written when the option is chosen; "on" or "off" is the default
#   #@if EXPR              a block written when EXPR holds: names joined by & (and) and | (or),
#                          a leading ! negates a name; & binds tighter than |. #@end closes it
#   #@hide ... #@show      lines left out of the written file (this explanation)
#@show
#
# Force button notes (channel 1): Shift 49, Menu 2, Knobs 1, Mixer 11, Master 5, Edit 37, Clip 9,
#                                 Rec Arm 93, Up 112, Down 113, Left 114, Right 115
# Touch taps are raw: x = screen_y * 1.6, y = 720 - screen_x * 0.5625 (the touch panel is 1280 x 720,
# rotated against the screen). Checked on a Force on 2026-10-09 (docs/NOTES.md).
# Taps hit screen positions, so the blocks that tap an icon need the default Mode Menu layout.

#@always
log 0

# With Shift held, remapped buttons keep their normal function unless a "held" rule says otherwise.
hold 49

longms 400
holdms 800
dblms 350
touchms 300

#@option mixer-master on Mixer twice: Master (the first press opens the mixer as usual)
dbl 11 b5

#@option mixer-tabs on Mixer + Up / Down / Left / Right: the mixer's Pan & Volume / Effects / I/O / Sends tabs
# taps the tab bar at the bottom of the mixer screen
combo 11 112 t1232,540
combo 11 113 t1232,301
combo 11 114 t1232,181
combo 11 115 t1232,421

#@option edit-editor on Edit twice: the plugin / track editor (the stock Shift + Clip shortcut)
dbl 37 d49 b9 u49

#@option clip-arrange on Clip + Left: Arrange (needs Arrange in the top-left slot of the Mode Menu)
combo 9 114 b2 t280,487

#@option menu-main-mode on Menu twice: tap the Main Mode icon (needs the default Mode Menu layout; the first press opens the menu as usual)
dbl 2 t331,655

#@option skipback off Rec Arm twice: the skipback-save trigger (taps note 127, a placeholder for the skipback addin; nothing listens yet, and the first press still arms as usual)
dbl 93 b127

#@option knobs-short off Knobs, short press: Shift + Knobs (a held press is then a plain Knobs press)
tap 1 d49 b1 u49
# Shift + Knobs is a plain Knobs press
held 1 u49 b1 d49

#@option knobs-long off Knobs, long press: a plain Knobs tap
long 1 b1

#@option knobs-double off Knobs, double press: the original long press (Knobs held while the button is held, at least holdms)
dbl 1 h1

#@if !knobs-short&knobs-long|!knobs-short&knobs-double
# long and double presses need a short-press rule; without the Shift one, a short press is a plain Knobs tap
tap 1 b1
#@end
