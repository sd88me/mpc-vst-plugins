# hwremap config for MPC Live -> /sdcard/hwremap.conf on the device; edits apply on the next button press.
# Buttons are notes on channel 1, pads are notes on channel 10 (see hwremap.c for tokens).
#
# MPC Live / Live II button notes: Shift 49, Menu 123, Next Seq 42, Main 52, - 55, + 54,
#                                  Pad Bank A-D 35-38
# Pad notes (pad 1 = bottom left): 1:0x25 2:0x24 3:0x2A 4:0x52 5:0x28 6:0x26 7:0x2E 8:0x2C
#                                  9:0x30 10:0x2F 11:0x2D 12:0x2B 13:0x31 14:0x37 15:0x33 16:0x35
# Hold Menu + pad N opens the mode at that position of the 4x4 Mode Menu (pad 13 = top left).
# mName finds the mode in the saved Mode Menu layout (MPC.settings is written when MPC saves
# preferences or exits, so a moved icon is picked up after that).

log 0

# With Shift held, remapped buttons keep their normal function (value change, banks E-H).
hold 49

# Pad Bank A-D: the top row of the Mode Menu, left to right
35 d123 p0x31 u123
36 d123 p0x37 u123
37 d123 p0x33 u123
38 d123 p0x35 u123

# + : first icon of the second row
54 d123 p0x30 u123
# + twice: third icon of the second row
dbl 54 d123 p0x2D u123

# - : second icon of the second row
55 d123 p0x2F u123
# - twice: fourth icon of the second row
dbl 55 d123 p0x2B u123
dblms 350
