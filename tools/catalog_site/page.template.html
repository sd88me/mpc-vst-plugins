<script>
/* a link to a collapsible section (page.html#its-title) opens it */
function openFold() {
  var h = decodeURIComponent(location.hash.slice(1)), e = h ? document.getElementById(h) : null;
  if (!e) return;
  for (var n = e; n; n = n.parentElement) if (n.tagName === "DETAILS") n.open = true;
  e.scrollIntoView();
}
addEventListener("hashchange", openFold); openFold();
</script>
