# Plugin Manager screen (live text sizes are MPC font heights = 1.52 x the CSS font size;
# 1280 x 628 plugin area; shadow coordinates, y = skin y + 86). The artwork is in images/
# (make_images.py); everything live or switched is a parameter the engine computes (src/manager.c).
