<!doctype html>
<!-- The Plugin Manager's web page (src/web.c serves it; regenerate src/web_page.h with vst/gen_web.py after editing). -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plugin Manager</title>
<style>
:root { --bg:#e9e7e2; --p:#f7f6f3; --l:#cdcac2; --fg:#1b1c1f; --m:#64666d; --a:#d63a30; --ok:#2e7d32; }
body { font:15px/1.5 system-ui,sans-serif; margin:0 16px 90px; background:var(--bg); color:var(--fg); }
.w { max-width:1180px; margin:auto; }
h1 { font:700 30px system-ui; text-transform:uppercase; margin:22px 0 4px; }
#st { color:var(--m); margin:0 0 12px; } #st.e { color:var(--a); }
.tabs { display:flex; gap:6px; margin:8px 0; } .tabs button[aria-pressed=true] { background:var(--fg); color:#fff; }
input[type=search] { font:15px system-ui; padding:9px 11px; border:1px solid var(--l); border-radius:6px; width:100%; box-sizing:border-box; background:var(--p); }
/* cards: the catalog site's look (tools/catalog_site/site.css .grid/.card/.tag/.meta) */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap:14px; margin:10px 0; align-items:start; }
.card { background:var(--p); border:1px solid var(--l); border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.card .shot { display:block; margin:-16px -16px 0; aspect-ratio:2/1; overflow:hidden; background:#1b1c1f; border-radius:5px 5px 0 0; cursor:zoom-in; border:0; padding:0; width:calc(100% + 32px); }
.card .shot img { display:block; width:100%; height:100%; object-fit:cover; }
.card header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.card h2 { font:700 22px/1.05 system-ui; text-transform:uppercase; margin:0; cursor:pointer; } .card h2:hover { color:var(--a); }
.by { color:var(--m); font-size:13px; margin-top:2px; }
.ver { font:500 12px/1 system-ui; background:#1b1c1f; color:#f4f4f4; border-radius:3px; padding:6px 8px; white-space:nowrap; }
.card p { margin:0; font-size:14px; }
.tags { display:flex; gap:6px; flex-wrap:wrap; }
.tag { font:600 10px/1 system-ui; letter-spacing:.1em; text-transform:uppercase; color:var(--m); border:1px solid var(--l); border-radius:3px; padding:5px 7px; }
.tag.v { color:var(--a); border-color:var(--a); } .tag.g { color:var(--fg); border-color:var(--fg); } .tag.x { color:#7a5600; border-color:#e0a100; background:#f6ead0; }
.tag.inst { color:var(--ok); border-color:var(--ok); } .tag.upd { color:#7a5600; border-color:#e0a100; }
.meta { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:12px; color:var(--m); border-top:1px solid var(--l); padding-top:10px; margin:0; }
.meta dt { font-weight:600; text-transform:uppercase; letter-spacing:.08em; font-size:11px; } .meta dd { margin:0; color:var(--fg); }
.linkbtn { background:none; border:0; color:var(--a); padding:9px 4px; }
.acts { display:flex; gap:8px; flex-wrap:wrap; }
.modal { position:fixed; inset:0; z-index:10; background:rgba(12,12,14,.82); display:flex; justify-content:center; align-items:flex-start; padding:48px 16px 32px; overflow-y:auto; }
.modal[hidden] { display:none; } .modal .card { width:min(860px,100%); } .modal .shot { aspect-ratio:auto; cursor:default; } .modal .shot img { height:auto; object-fit:contain; }
.modal .x { position:absolute; top:8px; right:16px; color:#fff; background:none; border:0; font-size:32px; }
.notes { font-size:13px; white-space:pre-wrap; background:var(--bg); border-radius:6px; padding:10px; max-height:240px; overflow:auto; }
.r { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .r .t { flex:1 1 220px; min-width:0; }
.d { color:var(--m); font-size:13px; display:block; }
button { font:600 13px system-ui; text-transform:uppercase; letter-spacing:.06em; border:1px solid var(--l); background:var(--p); border-radius:6px; padding:9px 12px; cursor:pointer; color:var(--fg); }
button.p { background:var(--a); border-color:var(--a); color:#fff; } button.q { border-color:var(--a); color:var(--a); } button:disabled { opacity:.45; }
.mv { background:var(--p); border:1px solid var(--l); border-left:4px solid var(--a); border-radius:6px; padding:10px 12px; margin:10px 0; }
.files { background:var(--p); border:1px solid var(--l); border-radius:6px; padding:10px 12px; margin:8px 0 2px; }
.files h3 { font:700 14px system-ui; text-transform:uppercase; letter-spacing:.06em; margin:4px 0; }
.files ul { list-style:none; padding:0; margin:6px 0; } .files li { display:flex; gap:8px; align-items:center; padding:3px 0; font-size:14px; }
.files li span { flex:1; } .ok { color:var(--ok); } .bad { color:var(--a); }
#bar { position:fixed; left:0; right:0; bottom:0; background:var(--fg); color:#fff; padding:12px 16px; display:flex; justify-content:center; gap:14px; align-items:center; }
#bar[hidden] { display:none; }
#kinds button { padding:7px 10px; font-size:12px; } #kinds .n { opacity:.6; margin-left:4px; }
.top { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .top select { font:14px system-ui; padding:8px; border-radius:6px; border:1px solid var(--l); background:var(--p); }
.pg { height:6px; background:var(--l); border-radius:3px; overflow:hidden; margin:4px 0 0; } .pg i { display:block; height:100%; background:var(--a); }
</style>
<div class="w">
  <h1>Plugin Manager</h1>
  <p id="st">Loading…</p><div id="pg"></div>
  <div class="top"><span id="to"></span></div>
  <div id="mv"></div>
  <div class="tabs"><button data-t="0" aria-pressed="true">Discover</button><button data-t="1">Installed</button><button data-t="2">Updates</button></div>
  <div class="tabs" id="kinds"></div>
  <div class="top"><input type="search" id="q" placeholder="Name, developer, style or tag" style="flex:1 1 220px">
    <select id="style"></select><select id="sort"><option value="updated">Last updated</option><option value="added">Newest</option>
    <option value="downloads">Most downloaded</option><option value="name">Name</option></select></div>
  <p class="d" id="count"></p>
  <div class="grid" id="l"></div>
  <div class="modal" id="modal" hidden onclick="if (event.target == this) shut()"><button class="x" onclick="shut()" aria-label="Close">×</button><div id="mbody"></div></div>
</div>
<div id="bar" hidden><span id="bt"></span><button class="p" id="ap">Apply</button></div>
<script>
let S = null, tab = 0, open = {}, kind = 'all';   // open: plugin id -> its files panel (HTML) while shown
const $ = i => document.getElementById(i);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const H = {'X-PM': '1'};   // the server refuses changes without it (another web site cannot send it)
let CAT = {};   // id -> its catalog entry (the page reads the catalog itself: the MPC does not keep pictures, badges or notes)
const CATS = ['https://open-mpc.github.io/catalog.json', 'https://sd88me.github.io/mpc-vst-plugins/catalog.json'];
(async () => {
  for (const u of CATS) {
    try {
      const c = await (await fetch(u)).json();
      for (const p of (c.plugins || c)) CAT[p.id] = p;
      const st = [...new Set(Object.values(CAT).map(x => x.style).filter(Boolean))].sort();
      $('style').innerHTML = '<option value="">All styles</option>' + st.map(x => `<option>${esc(x)}</option>`).join('');
      load.last = ''; if (S) draw();
      return;
    } catch (e) {}
  }
})();

async function api(p) {
  const r = await fetch(p, {method: 'POST', headers: H});
  if (!r.ok) alert(await r.text());
  load.last = ''; load();
}
async function load() {
  try {
    const t = await (await fetch('/api/state', {cache: 'no-store'})).text();
    if (t == load.last) return;   // unchanged: keep the page as it is (an open file picker, a half-typed search)
    load.last = t; S = JSON.parse(t); if (!S.busy && !S.queued) load.restart = false; draw();
  }
  catch (e) {
    $('st').className = 'e';
    $('st').textContent = load.restart ? 'MPC is restarting to apply. This page reconnects by itself once the Plugin Manager is open on a track again.'
      : 'The MPC is not answering. Open the Plugin Manager on a track (or check the Wi-Fi); this page keeps trying.';
    $('bar').hidden = true;
  }
}

const L = {install: ['Install', 'p', 'install'], update: ['Update', 'p', 'install'], q_install: ['Queued: cancel', 'q', 'cancel'],
  q_update: ['Queued: cancel', 'q', 'cancel'], q_remove: ['Removing: cancel', 'q', 'cancel'], register: ['Register', '', 'register'],
  q_register: ['Queued: cancel', 'q', 'cancel']};

const KN = {all: 'All', instrument: 'Instruments', midi: 'MIDI', effect: 'Effects', addin: 'Addins'};
const kindOf = p => { const c = CAT[p.id] || {}; return p.kind == 'instrument' && c.role == 'midi' ? 'midi' : p.kind; };   // as the catalog site
const stable = c => (c.versions || []).find(v => !v.yanked && v.channel == 'stable') || (c.versions || [])[0] || {};
function badges(p, c) {   // the catalog site's: Verified Gen1/Gen2 (tier verified), Experimental, kind, style, Gen2 build; plus this MPC's state
  const t = [], v = stable(c);
  if (p.installed) t.push(`<span class="tag inst">Installed ${esc(p.installed)}</span>`);
  if (p.state == 'update' || p.state == 'q_update') t.push(`<span class="tag upd">Update ${esc(p.latest)}</span>`);
  if (c.tier == 'verified') (Array.isArray(c.verified_on) ? c.verified_on : ['gen1']).forEach(g => t.push(`<span class="tag v">Verified ${g == 'gen2' ? 'Gen2' : 'Gen1'}</span>`));
  if (c.tier == 'experimental') t.push('<span class="tag x">Experimental</span>');
  t.push(`<span class="tag">${esc((KN[kindOf(p)] || p.kind).replace(/s$/, ''))}</span>`);
  if (c.style) t.push(`<span class="tag">${esc(c.style)}</span>`);
  if (v.gen2) t.push(`<span class="tag g">${v.gen2_only ? 'Gen2 only' : 'Gen2 build'}</span>`);
  return t.join('');
}
function card(p, big) {
  const c = CAT[p.id] || {}, v = stable(c), a = L[p.state], dis = S.busy == 2 || S.busy == 3 ? 'disabled' : '';
  let b = a ? `<button class="${a[1]}" ${dis} onclick="api('/api/queue?id=${p.id}&do=${a[2]}')">${a[0]}</button>` : '';
  if (p.state == 'installed' || p.state == 'update') b += `<button ${dis} onclick="api('/api/queue?id=${p.id}&do=remove')">Remove</button>`;
  if (p.files) b += `<button onclick="files('${p.id}')">${open[p.id] ? 'Hide files' : 'Your files'}</button>`;
  if (!big) b += `<button class="linkbtn" onclick="more('${p.id}')">Details</button>`;
  const shot = c.screenshot ? `<button class="shot" onclick="more('${p.id}')"><img loading="lazy" alt="" src="${esc(c.screenshot)}"></button>` : '';
  const tested = (v.tested || []).map(x => esc(x.device + (x.firmware ? ', ' + x.firmware : '') + (x.date ? ' (' + x.date + ')' : ''))).join('<br>');
  return `<article class="card">${shot}<header><div><h2 onclick="more('${p.id}')">${esc(p.name)}</h2><div class="by">by ${esc(p.author)}</div></div>` +
    `<span class="ver">${esc(p.latest || p.installed || '')}</span></header>` +
    (c.summary ? `<p>${esc(big ? c.summary : c.summary.length > 160 ? c.summary.slice(0, 157) + '…' : c.summary)}</p>` : '') +
    `<div class="tags">${badges(p, c)}</div>` +
    (big && v.notes ? `<div><b>What's new in ${esc(v.version)}</b><div class="notes">${esc(v.notes)}</div></div>` : '') +
    (big && (c.tags || []).length ? `<div class="tags">${c.tags.map(x => `<span class="tag">#${esc(x)}</span>`).join('')}</div>` : '') +
    `<dl class="meta"><dt>Updated</dt><dd>${esc(c.updated || v.date || 'n/a')}</dd><dt>Downloads</dt><dd>${(c.downloads || 0).toLocaleString()}</dd>` +
    (big && tested ? `<dt>Tested on</dt><dd>${tested}</dd>` : '') + (big && c.license ? `<dt>Licence</dt><dd>${esc(c.license)}</dd>` : '') +
    (big && c.repo ? `<dt>Source</dt><dd>${esc(c.repo)}</dd>` : '') + `</dl>` +
    `<div class="acts">${b}</div>${open[p.id] || ''}</article>`;
}
function more(id) { draw.modal = id; $('modal').hidden = false; draw(); }
function shut() { draw.modal = ''; $('modal').hidden = true; }
document.addEventListener('keydown', e => { if (e.key == 'Escape') shut(); });

function draw() {
  const st = $('st');
  st.textContent = S.problem || S.status;
  st.className = S.problem || S.status_kind == 2 ? 'e' : '';
  $('mv').innerHTML = '';
  $('pg').innerHTML = S.downloading ? `<div class="pg"><i style="width:${Math.round(S.progress * 100)}%"></i></div>` : '';
  $('to').innerHTML = S.targets.length > 1 ? `Install new plugins to <select onchange="api('/api/target?k=' + this.value)" ${S.busy == 2 || S.busy == 3 ? 'disabled' : ''}>` +
    S.targets.map((t, k) => `<option value="${k}" ${k == S.tsel ? 'selected' : ''}>${esc(t.name)}</option>`).join('') + `</select> <span class="d" style="display:inline">${esc(S.disk)}</span>`
    : S.disk ? `<span class="d">${esc(S.disk)}</span>` : '';
  const q = $('q').value.toLowerCase(), busy = S.busy == 2 || S.busy == 3, dis = busy ? 'disabled' : '';
  const inTab = S.plugins.filter(p => tab == 0 ? p.state != 'installed' : tab == 1 ? p.installed : p.state == 'update' || p.state == 'q_update');
  $('kinds').innerHTML = Object.keys(KN).map(k => `<button aria-pressed="${k == kind}" onclick="kind='${k}';draw()">${KN[k]}<span class="n">${
    k == 'all' ? inTab.length : inTab.filter(p => kindOf(p) == k).length}</span></button>`).join('');
  const sty = $('style').value, so = $('sort').value;
  const hay = p => { const c = CAT[p.id] || {}; return [p.name, p.author, c.style, (c.tags || []).join(' '), c.summary].join(' ').toLowerCase(); };
  const ps = inTab.filter(p => kind == 'all' || kindOf(p) == kind).filter(p => !sty || (CAT[p.id] || {}).style == sty)
    .filter(p => !q || hay(p).includes(q));
  const cv = (p, k) => (CAT[p.id] || {})[k] || '';
  ps.sort((a, b) => so == 'name' ? a.name.localeCompare(b.name) : so == 'downloads' ? (cv(b, 'downloads') || 0) - (cv(a, 'downloads') || 0)
    : String(cv(b, so)).localeCompare(String(cv(a, so))) || a.name.localeCompare(b.name));
  $('count').textContent = ps.length + ' of ' + inTab.length;
  $('l').innerHTML = ps.map(p => card(p, false)).join('') || '<p class="d">Nothing here.</p>';
  if (draw.modal) { const m = S.plugins.find(x => x.id == draw.modal); if (m) $('mbody').innerHTML = card(m, true); }
  $('bar').hidden = !S.queued && !S.ready;
  $('bt').textContent = busy ? 'Working…' : S.ready ? 'Ready. MPC will restart to apply.' : S.queued + ' change' + (S.queued == 1 ? '' : 's') + ' queued';
  $('ap').textContent = S.ready ? 'Restart MPC and apply' : 'Apply';
  $('ap').disabled = busy;
}

// ---- the user's files (ROMs): the rules come from the plugin's mpc-plugin.json user_files (the desktop app's checks, userfiles.go)
const G = {};   // id -> its user_files groups
function hasExt(n, ex) { const e = n.slice(n.lastIndexOf('.')).toLowerCase(); return ex.some(x => x.toLowerCase() == e); }
function findBytes(d, t, from = 0) {
  outer: for (let i = from; i <= d.length - t.length; i++) { for (let j = 0; j < t.length; j++) if (d[i + j] != t[j]) continue outer; return i; }
  return -1;
}
const enc = s => new TextEncoder().encode(s);
function fileVersion(d, sig) {
  const i = findBytes(d, enc(sig)); if (i < 0) return null;
  const o = d.indexOf(91, i + sig.length); if (o < 0) return null;   // '['
  const c = d.indexOf(93, o + 1); if (c < 0 || c - o - 1 > 64) return null;   // ']'
  return new TextDecoder().decode(d.slice(o + 1, c)).toLowerCase();
}
function validate(g, name, d) {   // -> {status: ok|maybe|bad|ignored, label, message}
  let first = '', matched = false;
  for (const r of g.rules) {
    if (!hasExt(name, r.ext || [])) continue;
    matched = true;
    const n = d.length, lab = (r.label || '').toLowerCase();
    let why = '', label = r.label;
    if (r.size > 0 && n != r.size) why = `the size is ${n} bytes, ${lab} needs exactly ${r.size}`;
    else if ((r.size_min > 0 && n < r.size_min) || (r.size_max > 0 && n > r.size_max)) why = `the size is ${n} bytes, ${lab} is ${r.size_min} to ${r.size_max}`;
    else if ((r.header && findBytes(d.subarray(0, r.header.length), enc(r.header)) != 0) ||
             (r.header_hex && findBytes(d.subarray(0, r.header_hex.length / 2), hexBytes(r.header_hex)) != 0)) why = 'this is not the right kind of file for ' + lab;
    if (!why) why = nameProblem(r, name);
    if (!why && r.signature) {
      const v = fileVersion(d, r.signature);
      if (v == null) why = 'this does not look like ' + lab + ' (its identification text is missing)';
      else if (r.versions && r.versions.length) {
        const m = r.versions.find(c => v.startsWith(c.prefix.toLowerCase()));
        if (m) label = m.label; else why = `its version "${v}" is not one the plugin supports`;
      }
    }
    if (why) { first = first || why; continue; }
    return r.unverified ? {status: 'maybe', label, message: r.note || '', saveAs: r.save_as} : {status: 'ok', label, saveAs: r.save_as};
  }
  return matched ? {status: 'bad', message: first} : {status: 'ignored', message: 'not a file type this plugin uses'};
}
function hexBytes(h) {   // a rule's header_hex; bad hex matches nothing (userfiles.go hexBytes)
  if (!/^([0-9a-fA-F]{2})+$/.test(h)) return enc('\0not hex\0');
  return new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
}
function nameProblem(r, name) {   // userfiles.go nameProblem, for an upload (a stored file is listed as it is)
  const low = name.toLowerCase();
  if (r.names && r.names.length && !r.names.some(n => n.toLowerCase() == low)) return `${r.label} must be named ${r.names.join(' or ')}`;
  if (r.name_contains && !low.includes(r.name_contains.toLowerCase())) return `the name of ${(r.label || '').toLowerCase()} must contain ${r.name_contains}: rename the file`;
  return '';
}
function storedNote(g, f) {   // a file already there: under a rule's save_as name only (its content is checked when uploaded)
  const r = g.rules.filter(r => hasExt(f.name, r.ext || []));
  if (!r.length) return ' <span class="bad">not a file this plugin uses</span>';
  if (r.every(x => x.save_as) && !r.some(x => x.save_as.toLowerCase() == f.name.toLowerCase()))
    return ` <span class="bad">the plugin loads it only as ${esc(r.map(x => x.save_as).join(' or '))}: delete it and add it again</span>`;
  return r.some(x => (x.size && x.size == f.size) || (!x.size && (!x.size_min || f.size >= x.size_min) && (!x.size_max || f.size <= x.size_max)))
    ? ' <span class="ok">✓</span>' : ' <span class="bad">wrong size</span>';
}
const okName = n => /^[A-Za-z0-9][A-Za-z0-9 ._()+,'&-]{0,150}$/.test(n);

async function files(id, keep) {
  if (open[id] && !keep) { delete open[id]; draw(); return; }
  if (!G[id]) {
    const r = await fetch('/api/manifest?id=' + encodeURIComponent(id));
    if (!r.ok) { alert(await r.text()); return; }
    G[id] = (await r.json()).user_files || [];
  }
  let h = '<div class="files">';
  for (const [k, g] of G[id].entries()) {
    const r = await fetch(`/api/ls?id=${encodeURIComponent(id)}&path=${encodeURIComponent(g.path)}`);
    const have = r.ok ? await r.json() : [];
    h += `<h3>${esc(g.label || g.path)}</h3>${g.description ? `<span class="d">${esc(g.description)}</span>` : ''}<ul>` +
      (have.map(f => `<li><span>${esc(f.name)} <span class="d" style="display:inline">${f.size} bytes</span>${storedNote(g, f)}</span>` +
        `<button onclick="del('${id}',${k},'${encodeURIComponent(f.name)}')">Delete</button></li>`).join('') || '<li><span class="d">No files yet.</span></li>') +
      `</ul><input type="file" multiple onchange="add('${id}',${k},this)">${g.hint ? `<span class="d">${esc(g.hint)}</span>` : ''}<div id="v-${id}-${k}"></div>`;
  }
  open[id] = h + '<span class="d">Files are checked in this browser, then copied into the plugin\'s folder on the MPC.</span></div>';
  draw();
}

async function add(id, k, input) {
  const g = G[id][k], out = [];
  for (const f of input.files) {
    const d = new Uint8Array(await f.arrayBuffer());
    const v = okName(f.name) ? validate(g, f.name, d) : {status: 'bad', message: 'rename the file: only letters, digits, spaces and ._()+,\'&- can be used'};
    if (v.status == 'ok' || v.status == 'maybe') {
      const as = v.saveAs || f.name;   // the plugin loads it by its save_as name, whatever it is called here
      const r = await fetch(`/api/file?id=${encodeURIComponent(id)}&path=${encodeURIComponent(g.path)}&name=${encodeURIComponent(as)}`, {method: 'PUT', headers: H, body: d});
      if (!r.ok) { v.status = 'bad'; v.message = 'not copied: ' + (await r.text()); }
      else if (as != f.name) v.label = (v.label || '') + ', saved as ' + as;
    }
    out.push(`<li><span class="${v.status == 'ok' ? 'ok' : v.status == 'bad' ? 'bad' : ''}">${esc(f.name)}: ${v.status == 'ok' ? 'copied (' + esc(v.label) + ')' :
      v.status == 'maybe' ? 'copied, looks right' + (v.message ? ' (' + esc(v.message) + ')' : '') : esc(v.message)}</span></li>`);
  }
  await files(id, true);
  const box = document.getElementById(`v-${id}-${k}`);
  if (box) box.innerHTML = '<ul>' + out.join('') + '</ul>';
  open[id] = open[id].replace(`<div id="v-${id}-${k}"></div>`, `<div id="v-${id}-${k}"><ul>${out.join('')}</ul></div>`);
}

async function del(id, k, name) {
  if (!confirm('Delete ' + decodeURIComponent(name) + ' from the MPC?')) return;
  const r = await fetch(`/api/delfile?id=${encodeURIComponent(id)}&path=${encodeURIComponent(G[id][k].path)}&name=${name}`, {method: 'POST', headers: H});
  if (!r.ok) alert(await r.text());
  files(id, true);
}
